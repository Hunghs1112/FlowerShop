services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: flowershop-app
    ports:
      - "8080:80"
    environment:
      APP_NAME: FlowerShop
      APP_ENV: local
      APP_DEBUG: "true"
      APP_URL: http://localhost:8000
      APP_KEY: ${APP_KEY:-}
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: flowershop
      DB_USERNAME: flowershop
      DB_PASSWORD: flowershop
      SESSION_DRIVER: database
      CACHE_STORE: database
      QUEUE_CONNECTION: database
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - .:/var/www/html
      - storage:/var/www/html/storage
      - /var/www/html/vendor
      - /var/www/html/node_modules

  db:
    image: mysql:8.4
    container_name: flowershop-db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: flowershop
      MYSQL_USER: flowershop
      MYSQL_PASSWORD: flowershop
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3307:3306"
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -proot --silent"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  db-data:
  storage:
