[program:flowershop-swoole-websocket]
process_name=%(program_name)s
command=php /home/YOUR_CPANEL_USER/public_html/artisan swoole:serve start
autostart=true
autorestart=true
user=YOUR_CPANEL_USER
numprocs=1
redirect_stderr=true
stdout_logfile=/home/YOUR_CPANEL_USER/public_html/storage/logs/swoole-supervisor.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=5
stopwaitsecs=10
stopsignal=TERM
startsecs=5

; Environment variables
environment=HOME="/home/YOUR_CPANEL_USER",USER="YOUR_CPANEL_USER"
